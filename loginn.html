<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepoChat Profile</title>
    <!-- Link to your separate CSS file -->
    <link rel="stylesheet" href="loginn.css">
    <!-- FontAwesome for the GitHub Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="page-container">
        <!-- Main Centered Card Container -->
        <div class="card">
            
            <!-- Logo Badge -->
            <div class="logo-badge">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                </svg>
            </div>

            <!-- Title -->
            <h1 class="card-title">RepoChat</h1>
            
            <!-- Subheading -->
            <h2 class="card-subtitle">Chat with any GitHub repo</h2>
            
            <!-- Description -->
            <p class="card-description">
                Ask questions in plain English and get answers that point to the exact files and lines.
            </p>

            <!-- Continue with GitHub Button -->
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="github-btn">
                <i class="fa-brands fa-github"></i>
                <span>Continue with GitHub</span>
            </a>

            <!-- Footer Security Note -->
            <p class="security-note">
                We request read-only access to the repos you choose. Your token is never exposed to the browser.
            </p>

        </div>
    </div>

</body>
</html>
